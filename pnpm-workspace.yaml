packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@hono/zod-validator': ^0.9.1
  '@mdi/font': ^7.4.47
  '@tanstack/vue-query': ^5.103.1
  '@types/node': ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
  zod: ^4.6.5
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  esbuild: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - tsx@4.23.14
