packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@hono/zod-validator': ^0.9.1
  '@jsquash/webp': ^1.5.0
  '@mdi/font': ^7.4.47
  '@panzoom/panzoom': ^4.6.2
  '@tanstack/vue-query': ^5.103.1
  '@types/node': ^24
  '@types/qrcode': ^1.5.6
  chart.js: ^4.5.1
  hono: ^4.13.9
  jsqr: ^1.4.0
  qrcode: ^1.5.4
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vue-chartjs: ^5.3.4
  zod: ^4.6.5
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
allowBuilds:
  esbuild: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - tsx@4.23.14
